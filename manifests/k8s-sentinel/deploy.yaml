apiVersion: v1
kind: Namespace
metadata:
  name: k8s-sentinel-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-sentinel
  namespace: k8s-sentinel-system
---
# Cluster-scoped: the tool creates/deletes NetworkPolicy objects and patches
# Deployments/StatefulSets/DaemonSets across arbitrary target namespaces, not
# just its own. Verbs are kept to exactly what internal/httpapi/isolate.go
# and internal/httpapi/harden.go actually call — no wildcards, no "patch" or
# "delete" on workloads, no "get" on workload types that are only ever
# listed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-sentinel
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list", "update"]
  - nonResourceURLs: ["/version"] # GET /readyz calls Discovery().ServerVersion()
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-sentinel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-sentinel
subjects:
  - kind: ServiceAccount
    name: k8s-sentinel
    namespace: k8s-sentinel-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-sentinel
  namespace: k8s-sentinel-system
  labels:
    app: k8s-sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-sentinel
  template:
    metadata:
      labels:
        app: k8s-sentinel
    spec:
      serviceAccountName: k8s-sentinel
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k8s-sentinel
          image: k8s-sentinel:dev # replace with a real registry tag outside local kind
          ports:
            - name: http
              containerPort: 8080
          # Matches internal/harden/baseline.go's DefaultResourceDefaults()
          # exactly — the tool enforces the same baseline on itself that it
          # enforces on everything else it hardens.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-sentinel
  namespace: k8s-sentinel-system
spec:
  selector:
    app: k8s-sentinel
  ports:
    - name: http
      port: 8080
      targetPort: http
