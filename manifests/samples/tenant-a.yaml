apiVersion: v1
kind: Namespace
metadata:
  name: tenant-a
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: tenant-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          # netshoot bundles curl/dig/nc — used as the exec-into-and-test client,
          # not as a real gateway workload.
          image: nicolaka/netshoot:latest
          command: ["sleep", "infinity"]
