kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8s-sentinel
# kindnet (kind's default CNI) does not enforce NetworkPolicy at all.
# Disabling it and installing Calico instead is what makes our standard
# NetworkPolicy objects actually block traffic in this local test cluster.
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16" # matches Calico's default IPAM pool
nodes:
  - role: control-plane
  - role: worker
